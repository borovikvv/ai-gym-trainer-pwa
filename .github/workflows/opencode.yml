name: OpenCode

# Исполнитель конвейера: по метке ready-for-code пишет код по плану из issue
# и открывает PR. Работает на подписке OpenCode Go (открытые модели),
# чтобы объём кода не расходовал квоту Claude — та нужна на план и ревью.

on:
  issues:
    types: [labeled]
  pull_request:
    types: [labeled]

concurrency:
  group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  implement:
    # Репозиторий публичный: issue может завести кто угодно, а его текст
    # становится инструкцией для агента. Поэтому и метка, и автор issue
    # должны быть свои.
    if: >-
      github.event_name == 'issues' &&
      github.event.label.name == 'ready-for-code' &&
      github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash
          prompt: |
            В issue #${{ github.event.issue.number }} есть комментарий с планом от Claude. Выполни его.

            Правила:
            - Делай ровно то, что написано в плане. Чего в плане нет — не делай:
              вместо этого напиши комментарий в issue и остановись.
            - Ветку не создавай и не переключайся: экшен уже подготовил ветку и
              сам откроет PR. Смена ветки ломает публикацию — работа пропадёт.
            - Тест обязателен, если меняется поведение. Для бага порядок обратный:
              сначала падающий тест, затем фикс.
            - Тесты не должны зависеть от текста UI-элементов и хардкода дат:
              только `data-testid`, `aria-label` или роль элемента.
            - Перед PR прогони локально: `npm run lint`, `npx tsc -b`, `npm test`,
              `npm run build`. Красное не выкладывай — чини.
            - Файлы в `.github/workflows/` не трогай никогда.
            - Секреты и содержимое `.env` в код, коммиты и комментарии не попадают.
            - Открой PR с описанием на русском: что меняется, зачем, что может
              сломаться, как проверено. В описании укажи `Fixes #${{ github.event.issue.number }}`.

  address-review:
    # Метку changes-requested ставит ревьюер. Чиним только свои же PR —
    # ветки, которые завёл исполнитель, и только из этого репозитория.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.label.name == 'changes-requested' &&
      startsWith(github.event.pull_request.head.ref, 'opencode/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/deepseek-v4-flash
          prompt: |
            На PR #${{ github.event.pull_request.number }} ревью оставило замечания. Исправь их.

            Правила:
            - Замечания читай в комментариях PR: `gh pr view ${{ github.event.pull_request.number }} --comments`.
              Работай по последнему разбору от ревьюера, а не по всей истории.
            - Правь только то, о чём написано в замечаниях. Появилась идея сверх этого —
              напиши комментарием в PR и не делай.
            - Не согласен с замечанием — не молчи и не выполняй вслепую: ответь
              комментарием, почему, и оставь как есть.
            - Ветку не меняй, работай в текущей. Коммить в неё же.
            - Перед тем как закончить, прогони локально: `npm run lint`, `npx tsc -b`,
              `npm test`, `npm run build`. Красное не оставляй.
            - Файлы в `.github/workflows/` не трогай никогда.
            - Секреты и содержимое `.env` в код, коммиты и комментарии не попадают.
            - Закончив, сними метку, чтобы владелец видел, что круг пройден:
              `gh pr edit ${{ github.event.pull_request.number }} --remove-label changes-requested`.
              Ревью запускается заново комментарием `@claude review` — его пишет владелец.
